<svg xmlns="http://www.w3.org/2000/svg" width="216" height="60" viewBox="0 0 216 60" shape-rendering="crispEdges"><style>
.neon{animation:hue 4s linear infinite}
@keyframes hue{0%,100%{fill:#22d3ee}33%{fill:#a78bfa}66%{fill:#f472b6}}
.tw{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{0%{opacity:1}50%{opacity:0}}
.eye{animation:eye 3.4s steps(1) infinite}
@keyframes eye{0%,92%{opacity:1}94%,97%{opacity:0}98%,100%{opacity:1}}
.fa{animation:fa .4s steps(1) infinite}
.fb{animation:fb .4s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(-90px)}to{transform:translateX(980px)}}
.hop{animation:hop 1.75s ease-out infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0)}75%{transform:translateY(-34px)}}
.sc1{animation:sc1 .9s linear infinite}
@keyframes sc1{to{transform:translateX(-80px)}}
.sc2{animation:sc2 2.4s linear infinite}
@keyframes sc2{to{transform:translateX(-120px)}}
